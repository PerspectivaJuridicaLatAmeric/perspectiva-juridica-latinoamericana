<text x="102" y="334" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#102c45">DENUNCIA</text>
<text x="102" y="378" font-family="Arial, sans-serif" font-size="26" fill="#263e51">Comunica hechos que</text>
<text x="102" y="413" font-family="Arial, sans-serif" font-size="26" fill="#263e51">pueden ser delictivos.</text>
<text x="622" y="334" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#102c45">QUERELLA</text>
<text x="622" y="378" font-family="Arial, sans-serif" font-size="26" fill="#263e51">Manifiesta la voluntad de</text>
<text x="622" y="413" font-family="Arial, sans-serif" font-size="26" fill="#263e51">la persona legitimada.</text>
<text x="72" y="508" font-family="Arial, sans-serif" font-size="24" fill="#e9eef2">No todos los delitos requieren querella.</text>
