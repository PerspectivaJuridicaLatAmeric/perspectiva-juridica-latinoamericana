<text x="588" y="225" font-family="Arial, sans-serif" font-size="66" font-weight="bold" fill="white">QUERELLA</text>
<rect x="72" y="274" width="495" height="182" rx="18" fill="#f3f6f8"/>
<rect x="592" y="274" width="536" height="182" rx="18" fill="#f3f6f8"/>
