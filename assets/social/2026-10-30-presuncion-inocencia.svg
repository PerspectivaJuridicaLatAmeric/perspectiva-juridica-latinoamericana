<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#14213b"/><stop offset="1" stop-color="#27445a"/></linearGradient></defs><rect width="1200" height="630" fill="url(#g)"/><rect width="1200" height="9" fill="#d2a858"/><text x="64" y="61" font-family="Arial,sans-serif" font-size="22" font-weight="bold" letter-spacing="2" fill="#d2a858">PERSPECTIVA JURÍDICA LATINOAMERICANA</text><text x="64" y="116" font-family="Arial,sans-serif" font-size="25" fill="#d8e2ea">DEBIDO PROCESO · MÉXICO</text><text x="64" y="186" font-family="Arial,sans-serif" font-size="55" font-weight="bold" fill="#ffffff">PRESUNCIÓN DE INOCENCIA</text><text x="64" y="227" font-family="Arial,sans-serif" font-size="24" fill="#d8e2ea">Una detención no equivale a una condena.</text><rect x="64" y="267" width="1072" height="230" rx="22" fill="#f3f6f8"/><rect x="98" y="307" width="464" height="151" rx="18" fill="#f9e7e7"/><rect x="638" y="307" width="464" height="151" rx="18" fill="#e2f1e9"/><text x="330" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#9c3232">DETENCIÓN</text><text x="330" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#1c3344">No determina culpabilidad</text><text x="600" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="bold" fill="#d2a858">≠</text><text x="868" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#18664a">CONDENA</text><text x="868" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#1c3344">Requiere decisión judicial</text><path d="M64 538H1136" stroke="#d2a858" stroke-width="2"/><text x="64" y="575" font-family="Arial,sans-serif" font-size="21" fill="#d2a858">Fuente: CNPP, artículo 13</text><text x="1136" y="602" text-anchor="end" font-family="Arial,sans-serif" font-size="19" fill="#e9eef2">Editor: Norvin W. González López</text></svg>